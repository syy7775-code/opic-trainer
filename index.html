<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPIc AL 트레이너 · 모의고사</title>
<style>
:root{--bg:#0f1216;--panel:#171b21;--panel2:#1e232b;--line:#2a313b;--text:#e7eaee;--mute:#9aa3ad;--acc:#3ec7a6;--acc2:#5aa9ff;--warn:#f0b44c;--bad:#ef6b6b;--good:#5ad18a;--purple:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
a{color:var(--acc2)}
header{position:sticky;top:0;z-index:5;background:#0f1216ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.3px}
.brand span{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mute);padding:7px 11px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:var(--panel2);color:var(--text)}
.dday{margin-left:auto;font-size:13px;color:var(--mute)}
.dday b{color:var(--warn)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15.5px;margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{border-color:#3a4450}
.btn.pri{background:var(--acc);color:#06261f;border-color:var(--acc)}
.btn.red{background:var(--bad);color:#2a0606;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.tag.acc{color:var(--acc);border-color:#2b6f60}
.tag.warn{color:var(--warn);border-color:#6d5427}
.tag.bad{color:var(--bad);border-color:#6d2f2f}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--mute);padding:6px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:13.5px}
.chip.on{background:#123a32;border-color:var(--acc);color:#d9fff5}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;background:#0c0f13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:150px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.qbox{background:linear-gradient(180deg,#18202a,#151a20);border:1px solid var(--line);border-radius:16px;padding:20px}
.eva{display:flex;gap:16px;align-items:center}
.ava{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fe7cf,#2a8f78 60%,#14453b);display:flex;align-items:center;justify-content:center;font-weight:800;color:#03211a;font-size:20px;flex:none;box-shadow:0 0 0 0 #3ec7a655}
.ava.talk{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3ec7a688}70%{box-shadow:0 0 0 16px #3ec7a600}100%{box-shadow:0 0 0 0 #3ec7a600}}
.qtext{font-size:17px;margin:12px 0 4px}
.qhidden{color:var(--mute);font-style:italic}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.meter{height:8px;background:#0c0f13;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .08s}
.live{background:#0c0f13;border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:70px;white-space:pre-wrap}
.live .int{color:var(--mute)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.prog{display:flex;gap:3px;margin:8px 0 14px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--panel2)}
.prog i.done{background:#2b6f60}.prog i.cur{background:var(--acc)}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar .lab{width:120px;font-size:13.5px;color:var(--mute);flex:none}
.bar .tr{flex:1;height:10px;background:#0c0f13;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .tr i{display:block;height:100%}
.bar .v{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.lvl{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1}
.lvlbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.issue{border-left:3px solid var(--warn);padding:8px 12px;background:#1b1810;border-radius:0 10px 10px 0;margin:8px 0}
.issue.bad{border-color:var(--bad);background:#1d1212}
.issue.good{border-color:var(--good);background:#0f1a14}
.issue b{display:block;margin-bottom:2px}
.tx{background:#0c0f13;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.9}
.c-conn{color:#8cc8ff;border-bottom:1px solid #8cc8ff55}
.c-past{color:#8ff0b5}
.c-err{background:#4a1d1d;color:#ffb3b3;border-bottom:2px wavy var(--bad);cursor:help}
.c-rep{background:#3d3214;color:#ffd98a}
.c-exp{background:#2e2147;color:#d9c4ff}
.legend span{margin-right:10px;font-size:12.5px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
details .in{padding:12px 14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.s-good{color:var(--good)}.s-mid{color:var(--warn)}.s-bad{color:var(--bad)}
.md h3,.md h4{margin:14px 0 6px}.md ul{margin:4px 0 8px 18px;padding:0}.md p{margin:6px 0}
.md code{background:#0c0f13;padding:1px 5px;border-radius:5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#233;border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:50}
.sample{white-space:pre-wrap;background:#0c0f13;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.75}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.flex1{flex:1}
.sep{height:1px;background:var(--line);margin:14px 0}
.note{font-size:13px;color:var(--mute);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:10px 0}
@media (max-width:640px){.bar .lab{width:92px}.lvl{font-size:36px}
 header{position:static}.top{gap:6px;padding:8px 10px}nav{flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap;padding:7px 9px}nav::-webkit-scrollbar{display:none}nav{scrollbar-width:none}.dday{margin-left:0}
 main{padding:12px 10px 80px}.card,.qbox{padding:13px}.ava{width:52px;height:52px;font-size:15px}.eva{gap:10px;align-items:flex-start}.btn{padding:9px 12px}textarea{font-size:16px}input,select{font-size:16px}
 table{font-size:12.5px}th,td{padding:6px 5px}}
</style>
</head>
<body>
<header><div class="top">
  <div class="brand">OPIc <span>AL</span> 트레이너</div>
  <nav id="nav"></nav>
  <div class="dday" id="dday"></div>
</div></header>
<main id="app"></main>

<script>

const TYPES = {

  routine:{name:'루틴/습관', tense:'present', sec:[70,130], words:[110,230],
    tpl:'① 메인 포인트를 "행동"으로 → ② 순서대로 2~4단계 (first / then / after that / finally) → ③ 과거엔 달랐다 1~2문장 → ④ 지금 감정·깨달음 (I\'ve realized that) → ⑤ 요약 마무리.  빈도 부사(usually, always, every weekend) 필수.',

const SAMPLES = {
 intro:{q:INTRO_Q, a:"Hi Eva. Well, let me tell you a little bit about myself. My name is Alex Kim, and I'm a university student in Seoul. I'm double majoring in English and business, which might sound like a strange combination, but honestly, it works pretty well for me. These days, most of my energy goes into preparing for my career, because I want to work in finance. That's why I joined an investment club at school, where we analyze companies and share our own reports. On top of that, I work part-time at a café, so my schedule is pretty packed. When I do get some free time, I usually go for a long walk or catch a movie to clear my head. So yeah, that's pretty much who I am."},
 desc:{q:"Describe your home to me. What does it look like?", a:"Sure. So I live in a small but cozy place in the northwestern part of Seoul. Honestly, the best thing about my home is the location. It's just a few minutes from the bus stop, and there's a hiking trail near the neighborhood, so I can go for a walk whenever I want. Inside, there's a living room, a small kitchen, and my room at the end of the hallway. My room isn't huge, but it's really practical. I have a wooden desk by the window, a bookshelf packed with economics books, and a bed that I probably spend way too much time in. What I like the most is the natural light. In the morning, sunlight pours in through the window, and it kind of gives me the energy to start the day. So yeah, it's not fancy at all, but it's the place where I feel the most relaxed."},
 routine:{q:"What do you usually do to prepare for a trip?", a:"Well, I'd say I'm a pretty organized traveler, so I always prepare a lot before a trip. First of all, I decide where to go and check the weather, because that pretty much decides what I'm going to pack. Then I book everything online, like the train tickets and the accommodation. I usually compare a few websites, since prices can be totally different. A few days before I leave, I make a checklist on my phone. To be honest, in the past, I never did that, and I ended up forgetting my charger almost every single time, which was so annoying. These days, I just go through the list the night before, and I can pack my bag in about twenty minutes. Finally, on the morning of the trip, I double-check my ID and my tickets. I've realized that the more I prepare, the less stressed I am on the actual trip. So that's pretty much my routine."},
 past:{q:"Have you ever had a problem at home? What happened?", a:"Oh, that reminds me of something that happened last winter. It was one of the coldest nights of the year, and when I came home from my part-time job, the heating in our house just stopped working. At first, I thought it was a simple problem, so I tried turning the boiler off and on again, but nothing happened. The thing is, it was almost midnight, so the repair service wasn't available. Long story short, my family and I had to sleep under three blankets, and honestly, it really tested my patience. The next morning, I called the service center as soon as it opened, and a technician came over around noon. It turned out that a small part inside the boiler was broken, so he replaced it in about thirty minutes, which was such a relief. Since then, I always check the boiler before winter starts. Looking back, it's kind of a funny story now, but at the time, it was pretty miserable."},
 compare:{q:"How is the technology people use today different from when you were a child?", a:"These days, I pretty much do everything with my smartphone. I check the news, I manage my money, and I even read company reports on it. Honestly, I can't imagine a single day without it. But when I was a kid, things were totally different. Back then, my family had one desktop computer in the living room, and we had to take turns using it. If I wanted to look something up, I had to wait until my parents were done with it, which was so frustrating. Also, phones were just for calling and texting, and the internet was really slow. Now, on the other hand, everything is instant and personal. I think the biggest change is convenience, because we can get any information in a few seconds. That being said, I sometimes feel like I'm way too dependent on my phone. So yeah, technology has made life a lot easier, but it definitely has its downsides."},
 rp_ask:{q:"You want to join a new gym. Call the gym and ask three or four questions.", a:"Hi, is this Fit Zone Gym? Hello, my name is Alex. I just moved to this neighborhood, and I'm thinking about signing up for a membership, so I was wondering if I could ask you a few questions. First of all, what are your opening hours? I usually work out late at night, so I'd like to know if you're open after ten. Oh, really? Until midnight? That's perfect. Next, how much is a monthly membership, and do you have any discounts for students? I see. Also, are personal training sessions included, or do I have to pay for them separately? Okay, got it. Lastly, is there a shower room and lockers I can use? Great. Thank you so much for your help. I'll think about it and probably drop by this weekend. Have a good one!"},
 rp_problem:{q:"You can't make it to a meeting with your friend. Call, explain, and suggest alternatives.", a:"Hey Minji, it's me, Alex. I'm really sorry to call you so suddenly, but I have some bad news. I know we were supposed to meet for dinner tonight, but I don't think I can make it. The thing is, my manager at the café just called me, and the person who was supposed to work tonight is sick, so I have to cover his shift. I feel terrible, because we planned this a week ago. So, I have a couple of ideas. First, how about meeting this Saturday instead? I'm totally free in the afternoon, and dinner will be on me. Or, if you'd rather not wait, we could grab a late-night snack after my shift ends at eleven. Another option is just to move our reservation to next Friday, since the restaurant is pretty flexible. Just let me know what works best for you. Again, I'm so sorry, and call me back when you get this. Bye!"},
 rp_exp:{q:"Tell me about a time when you had to cancel plans with someone.", a:"Actually, something similar happened to me about a year ago. I had planned a trip to Busan with two of my friends, and we had already booked the train tickets and a guesthouse. But two days before the trip, I suddenly got a call about a job interview that was scheduled for the exact same day. Honestly, I was so torn, because I'd been looking forward to the trip for weeks. In the end, I decided to go to the interview, so I called my friends and explained the situation. I was worried they'd be upset, but they were really understanding. We ended up changing the train tickets to the next weekend, and I paid the cancellation fee for the guesthouse, since it was my fault. Looking back, it was the right decision, and the trip was even more fun because we had more time to plan it. I learned that being honest right away really makes things easier."},
 adv_compare:{q:"Compare how people managed their money in the past with how they manage it now.", a:"When it comes to managing money, I think the way people do it has changed dramatically. These days, most young people handle everything through apps. For example, I check my bank account, pay my bills, and even buy stocks on my phone in just a few taps. But my parents' generation was totally different. Back then, people had to visit the bank in person, wait in line, and write everything down in a bankbook. Also, most people just kept their money in savings accounts, because interest rates were pretty high and investing felt risky. Now, on the other hand, a lot of people in their twenties are into stocks, ETFs, and even crypto. Personally, I think this shift has pros and cons. It's great that investing is more accessible, but at the same time, some people jump in without understanding the risks. So I'd say the tools have gotten way better, but financial knowledge hasn't really caught up yet."},
 adv_issue:{q:"Tell me about the housing problems in your country and how they affect young people.", a:"Well, one of the biggest issues in Korea right now is housing prices, especially in Seoul. Honestly, it's something my friends and I talk about all the time. The problem is that apartment prices have gone up so much over the past decade that it's almost impossible for young people to buy a home with just their salary. Even rent has become really expensive, so a lot of people in their twenties and thirties end up living in tiny studios or staying with their parents much longer. As a result, many young people are putting off getting married or having kids, which is also connected to Korea's low birth rate. The government has tried a lot of policies, like loans for first-time buyers, but they haven't really solved the problem. In my opinion, the government should focus on supplying more affordable housing near job centers, rather than just changing loan rules. Anyway, I really hope things get better by the time I start working full-time."},
 rp_eva:{q:"I also like going to the movies. Ask me three or four questions.", a:"Oh, you like movies too? That's awesome, because I'm a huge movie fan myself. I'm curious, so let me ask you a few questions. First, what kind of movies do you usually watch? Are you more into action movies or dramas? Also, do you usually go to the theater, or do you just watch movies at home on Netflix? And who do you usually go with? Lastly, what's the best movie you've seen recently? I'm always looking for recommendations, so I'd love to hear about it. Thanks, Eva!"}

 // ---------- fluency
 let flu=null;
 if(ans.mode==='voice'&&ans.dur){
  const sd=Math.max(5,ans.speechDur||ans.dur);const wpm=nW/(sd/60);res.metrics.wpm=wpm;
  const ws=wpm<55?20:wpm<100?20+(wpm-55)/45*80:wpm<=170?100:wpm<=200?85:70;
  const pr=(ans.pauses||0)/(sd/60);res.metrics.pauseRate=pr;const ps=clamp(100-pr*28);
  const lat=ans.latency;const ls=lat==null?80:lat<=3?100:lat>=10?40:100-(lat-3)/7*60;
  const conf=ans.conf;const cs=conf?lin(conf,0.6,0.9):null;
  const rep=cnt(/\b(\w+) \1\b/,low);res.metrics.repeats=rep;
  if(ans.audioAnalysis===false)flu=cs==null?ws:(0.65*ws+0.35*cs);
  else flu=cs==null?(0.45*ws+0.4*ps+0.15*ls):(0.35*ws+0.35*ps+0.1*ls+0.2*cs);flu=clamp(flu-rep*4);
 }
 res.dims.fluency=flu;
 // ---------- volume
 const [wmin,wmax]=T.words;let vol=nW<wmin?lin(nW,wmin*0.35,wmin):nW>wmax*1.5?clamp(100-(nW-wmax*1.5)/wmax*120):100;
 if(ans.mode==='voice'&&ans.dur>200){vol=Math.min(vol,70);}
 res.dims.volume=vol;
 // ---------- shrink toward 50 when there is too little evidence (short answers)
 const ev=Math.min(1,nW/T.words[0]);for(const k of ['tense','accuracy','vocab']){const v=res.dims[k];if(v!=null&&v>45)res.dims[k]=45+(v-45)*ev}
 // ---------- total
 let sw=0,ss=0;for(const [k] of DIMS){const v=res.dims[k];if(v==null)continue;sw+=DIMW[k];ss+=DIMW[k]*v}
 res.total=ss/sw;if(!onTopic&&Q.t!=='intro')res.total*=0.9;
 const short=nW/T.words[0];if(short<0.6)res.total*=0.55+0.45*(short/0.6);
 // ---------- issues
 buildIssues(Q,ans,res,{nW,T,tc,distinct,cats,opener,closer,main,mt,advFound,qN,altN});
 return res;
}
const STOP=new Set('a an the and or but so to of in on at for with from by as is are was were be been being am i you he she it we they me my your his her its our their them us this that these those there here do does did have has had not no yes very really just like um uh oh well then than too also can could will would should may might must if when where what which who how why because about up out into over after before all some any more most much many one get got go went i\'m it\'s that\'s don\'t'.split(' '));
const STOPQ=new Set('tell about what your when where which there have does like would know detail details much many could things thing some describe happened happen also with that this they from been were them their into more most made make other first time times give \'d i\'d you\'re you\'ve kind kinds'.split(' '));

function buildIssues(Q,ans,res,x){
 const I=(sev,dim,t,d,f)=>res.issues.push({sev,dim,t,d,f});
 const D=res.dims;
 const miss=res.elements.filter(e=>e.part<1);
 if(miss.length){I(D.task<60?'bad':'warn','task','질문 요구사항 빠짐: '+miss.map(e=>e.label).join(', '),'유형('+x.T.name+')에서 기대하는 요소가 안 보였어.',miss.map(e=>'• '+e.label+': '+e.fix).join('\n'))}
 if(Q.t==='rp_problem'&&x.altN<2)I('bad','task','Q12형 문제해결: 대안이 부족함','대안 '+x.altN+'개. 진단서 기준으로 "상황 해결 성공(succeeds)"이 IH 이상, "unable to resolve"면 IM2에 머문다는 분석 (강지완).','대안 최소 2개 + 선택 요청: "How about ~ instead? Or, if that doesn\'t work, we could ~. Just let me know."');
 if(D.tense!=null&&D.tense<65){
  if(x.T.tense==='past')I(D.tense<45?'bad':'warn','tense','과거시제 통제 부족 (과거형 비율 '+Math.round((res.metrics.pastRatio||0)*100)+'%)','과거 경험 문항(보통 Q4·6·7·9·10·13)에서 과거형이 약하면 최대 IH에 막힌다는 진단서 분석. '+(res.slips.length?'예: "'+res.slips[0]+'"':''),'스토리 동사는 끝까지 과거로 (go→went, is→was). 녹음→받아쓰기로 시제만 따로 체크하는 연습 추천.');
  else if(x.T.tense==='mixed')I('warn','tense','과거-현재 대비가 약함','비교 문항인데 과거 '+x.tc.past+'개 / 현재 '+x.tc.pres+'개 동사. 둘 다 분명히 보여줘야 함.','Back then, I used to ~. But these days, I ~.');
  else if(x.T.tense==='present')I('warn','tense','묘사/루틴인데 현재시제가 약함','현재 습관·상태 질문이면 현재시제가 기본.','I usually ~ / It is ~ / There are ~');
  else if(x.T.tense==='any')I('warn','tense','시제·구문 다양성 부족','이슈 문항은 현재(상황)+과거(변화)+조동사(should/would)+미래(전망)를 섞어야 깊이가 보임.','It has gotten worse over the years. The government should ~. I think it will ~.');
 }
 if(D.text<60)I(D.text<40?'bad':'warn','text','문단 구성이 약함 (문장 나열 느낌)',[!x.opener&&'도입 멘트 없음',!x.main&&'초반에 핵심(메인 포인트)이 안 보임',!x.closer&&'마무리 멘트 없음'].filter(Boolean).join(' / ')+'. IM과 IH/AL의 가장 큰 차이가 문단 단위 발화라는 분석 (강지완 Scale 항목, Q2·5·8).','도입(Well, ~) → 메인 포인트 → 근거 2~3개 → 마무리(So yeah, that\'s pretty much it.)');
 if(D.connect<60)I('warn','connect','연결어·복문이 단조로움 (종류 '+x.distinct+'개)','사용 범주: '+([...x.cats].join(', ')||'거의 없음')+'. AL 정의: "적절한 위치에서 접속사를 사용해 결속력이 높다" (가이드북 p.13).','which/where 관계사, although/whereas 대조, as soon as/by the time 시간절을 섞어봐.');
 if(D.vocab<60||res.over.length){I(D.vocab<60?'warn':'warn','vocab',res.over.length?'같은 표현 반복: '+res.over.map(o=>o.w+' '+o.n+'회').join(', '):'어휘 폭이 좁음 (다양도 '+x.mt.toFixed(2)+')','같은 단어 반복은 "Breadth of Vocabulary" 체크로 IH 상한이 된다는 진단서 분석 (강지완).',res.over.length?res.over.map(o=>'• '+o.w+' → '+o.alts.join(', ')).join('\n'):'묘사 형용사·감정 표현을 문항마다 다르게 (I found it frustrating / which was such a relief).')}
 if(res.errors.length){const g={};for(const e of res.errors)(g[e.m]=g[e.m]||[]).push(e);I(D.accuracy<60?'bad':'warn','accuracy','문법 오류 '+res.errors.length+'개',Object.entries(g).map(([m,a])=>m+': "'+a[0].txt+'"').join(' / '),Object.entries(g).map(([m,a])=>'• '+a[0].f).join('\n'))}
 if(D.fluency!=null&&D.fluency<65){const m=res.metrics;I(D.fluency<45?'bad':'warn','fluency','유창성 경고','속도 '+Math.round(m.wpm||0)+' WPM'+(ans.pauses?(', 2.5초+ 멈춤 '+ans.pauses+'회'):'')+(ans.latency!=null?(', 첫 마디까지 '+ans.latency.toFixed(1)+'초'):'')+(ans.conf?(', 인식 신뢰도 '+Math.round(ans.conf*100)+'%'):'')+'. 2~3초 이상 끊기면 Fluency 감점 항목 (강지완).','막히면 침묵 대신 필러/전략 표현: "Let me think...", "What I mean is ~", "How should I put it...". 인식 신뢰도가 낮으면 발음·강세 점검.')}
 if(ans.mode==='voice'&&ans.conf&&ans.conf<0.75)I('warn','fluency','음성 인식이 불안정 (신뢰도 '+Math.round(ans.conf*100)+'%)','영어 OPIc은 AI 채점이고, 음성→텍스트(ASR) 변환을 거칠 수 있다는 분석이 있어. 인식이 잘 안 되는 단어는 발음 체크 포인트.','인식 결과에서 틀리게 받아쓴 단어를 찾아서 그 단어만 따로 또박또박 연습.');
 if(D.volume<60)I(D.volume<40?'bad':'warn','volume','발화량 부족 ('+x.nW+'단어)','이 유형 목표: '+x.T.words[0]+'~'+x.T.words[1]+'단어 / '+x.T.sec[0]+'~'+x.T.sec[1]+'초. IM1의 가장 큰 약점이 "말을 너무 적게" (오픽노잼).','메인 포인트 하나에 이유·예시·감정 2~3개를 붙여서 늘리기.');
 if(ans.mode==='voice'&&ans.dur>200)I('warn','volume','답변이 너무 김 ('+fmt(ans.dur)+')','AL 답변은 90초 안팎이 적당, 3분 가까운 IH 답변은 TMI로 핵심이 흐려진다는 지적 (오픽노잼·주책임). 40분 안에 15문항도 빠듯.','메인 포인트 1개 + 부연 1~2문장씩만. 1분 30초~2분에서 정리.');
 for(const [k,l] of DIMS){if(D[k]!=null&&D[k]>=82)res.good.push(l)}
}

function levelOf(score){return score>=80?'AL':score>=70?'IH':score>=62?'IM3':score>=54?'IM2':score>=45?'IM1':score>=35?'IL':'NH'}
function summarize(qs){
 const W=t=>t==='intro'?0.3:t==='rp_problem'?1.3:(t==='adv_compare'||t==='adv_issue')?1.4:1;
 let sw=0,ss=0;const dimAvg={};
 for(const [k] of DIMS){let a=0,n=0;for(const q of qs){const v=q.res&&q.res.dims[k];if(v!=null&&q.t!=='intro'){a+=v;n++}}dimAvg[k]=n?a/n:null}
 for(const q of qs){if(!q.res)continue;sw+=W(q.t);ss+=W(q.t)*q.res.total}
 const overall=sw?ss/sw:0;let lv=levelOf(overall);const caps=[];
 const cap=(L,why)=>{caps.push({L,why});if(LV.indexOf(lv)>LV.indexOf(L))lv=L};
 const pastQ=qs.filter(q=>q.res&&TYPES[q.t].tense==='past');
 if(pastQ.length){const a=pastQ.reduce((s,q)=>s+(q.res.dims.tense||0),0)/pastQ.length;if(a<60)cap('IH','과거 경험 문항 시제 평균 '+Math.round(a)+'점: 과거시제 통제가 약하면 IH가 상한이라는 진단서 분석')}
 const q12=qs.find(q=>q.t==='rp_problem'&&q.res);if(q12&&q12.res.dims.task<60)cap('IM2','문제해결 롤플레이(Q12) 과제 점수 '+Math.round(q12.res.dims.task)+': 해결 실패(unable)면 IM2라는 진단서 분석');
 if(dimAvg.volume!=null&&dimAvg.volume<45)cap('IM1','평균 발화량 부족: 말을 너무 적게 하면 IM1 패턴');
 const adv=qs.filter(q=>q.res&&(q.t==='adv_compare'||q.t==='adv_issue'));if(adv.length){const a=adv.reduce((s,q)=>s+q.res.total,0)/adv.length;if(a<66)cap('IH','고난도(Q14-15) 평균 '+Math.round(a)+'점: AL은 사회적 이슈를 정확하고 넓은 어휘로 다뤄야 함')}
 if(dimAvg.vocab!=null&&dimAvg.vocab<55)cap('IH','어휘 폭 평균 '+Math.round(dimAvg.vocab)+': 같은 표현 반복 시 IH 상한');
 const answered=qs.filter(q=>q.res&&q.res.metrics.words>=3).length;if(answered<qs.length-2)cap(levelOf(overall*0.85),'미응답 문항 '+(qs.length-answered)+'개');
 const weak=DIMS.filter(([k])=>dimAvg[k]!=null).sort((a,b)=>dimAvg[a[0]]-dimAvg[b[0]]).slice(0,3).map(([k,l])=>({k,l,v:dimAvg[k]}));
 return {overall,level:lv,raw:levelOf(overall),caps,dimAvg,weak};
}

/* =========================================================
   SPEECH: TTS + RECORDER + ASR
   ========================================================= */
let VOICES=[];
function loadVoices(){VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){if(S.voiceName){const v=VOICES.find(v=>v.name===S.voiceName);if(v)return v}return VOICES.find(v=>/en-US/i.test(v.lang)&&/Google US English|Samantha|Jenny|Aria|Female/i.test(v.name))||VOICES.find(v=>/en-US/i.test(v.lang))||VOICES[0]}
function speak(text){return new Promise(res=>{if(!('speechSynthesis' in window))return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=S.rate||0.95;const v=pickVoice();if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u);const guard=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(guard);res()}},500)})}
function beep(){try{const ac=getAC();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop()},180)}catch(e){}}

const Rec={
 reset(){this.chunks=[];this.finalText='';this.interim='';this.confs=[];this.firstSpeech=null;this.lastSpeech=null;this.silStart=null;this.pauseList=[];this.level=0;this.srErr=null;this.active=false},
 async start(onUpd){
  this.reset();this.t0=performance.now();this.stream=null;this.mr=null;this.an=null;
  if(S.recAudio!==false){
  this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  try{this.mr=new MediaRecorder(this.stream);this.mr.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data)};this.mr.start(1000)}catch(e){this.mr=null}
  this.ac=getAC();const src=this.ac.createMediaStreamSource(this.stream);this.src=src;this.an=this.ac.createAnalyser();this.an.fftSize=1024;src.connect(this.an);}
  const buf=this.an?new Float32Array(this.an.fftSize):null;
  this.t0=performance.now();let floor=null;const calib=[];
  if(this.an)this.iv=setInterval(()=>{this.an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const rms=Math.sqrt(s/buf.length);const t=performance.now();this.level=Math.min(1,rms/0.12);
   if(t-this.t0<450){calib.push(rms);onUpd&&onUpd();return}
   if(floor==null){calib.sort((a,b)=>a-b);floor=calib[Math.floor(calib.length*0.2)]||0.004}
   const thr=Math.max(0.012,floor*2.8);
   if(rms>thr){if(this.firstSpeech==null)this.firstSpeech=t;if(this.silStart!=null&&t-this.silStart>=2500)this.pauseList.push((t-this.silStart)/1000);this.silStart=null;this.lastSpeech=t}
   else if(this.firstSpeech!=null&&this.silStart==null)this.silStart=t;
   onUpd&&onUpd()},60);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;this.active=true;
  if(SR){const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;
   r.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){this.finalText+=x[0].transcript.trim()+' ';if(x[0].confidence>0)this.confs.push(x[0].confidence)}else im+=x[0].transcript}this.interim=im;onUpd&&onUpd()};
   r.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')this.srErr=e.error;onUpd&&onUpd()};
   r.onend=()=>{if(this.active){try{r.start()}catch(e){}}};
   this.recog=r;try{r.start()}catch(e){this.srErr='start-failed'}}
  else{this.recog=null;this.srErr='unsupported'}
 },
 async stop(){
  this.active=false;clearInterval(this.iv);
  if(this.recog){try{this.recog.stop()}catch(e){}}
  await new Promise(r=>setTimeout(r,800));
  if(this.mr&&this.mr.state!=='inactive'){await new Promise(r=>{this.mr.onstop=r;this.mr.stop()})}
  let url=null;if(this.chunks.length){url=URL.createObjectURL(new Blob(this.chunks,{type:(this.mr&&this.mr.mimeType)||'audio/webm'}))}
  try{this.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{this.src&&this.src.disconnect()}catch(e){}
  const now=performance.now();const dur=this.t0?(now-this.t0)/1000:0;
  const text=(this.finalText+' '+(this.interim||'')).replace(/\s+/g,' ').trim();
  const conf=this.confs.length?this.confs.reduce((a,b)=>a+b,0)/this.confs.length:null;
  return {audioUrl:url,transcript:text,dur,speechDur:this.firstSpeech!=null?((this.lastSpeech-this.firstSpeech)/1000):dur,latency:this.firstSpeech!=null?(this.firstSpeech-this.t0)/1000:null,pauses:this.pauseList.length,pauseList:this.pauseList,conf,srErr:this.srErr,audioAnalysis:!!this.an};
 },
 abort(){this.active=false;clearInterval(this.iv);try{this.recog&&this.recog.abort()}catch(e){}try{this.mr&&this.mr.state!=='inactive'&&this.mr.stop()}catch(e){}try{this.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{this.src&&this.src.disconnect()}catch(e){}}
};
</script>
<script>

const NAV=[['home','홈'],['mock','모의고사'],['practice','유형별 연습'],['history','기록'],['rubric','평가기준'],['bank','표현·모범답변'],['settings','설정']];
let VIEW='home',SES=null,REP=null,PSEL={t:'past',topic:''},LLMOUT={},MICTEST=null;
const app=$('#app');
const norm=t=>(t||'').replace(/[\u2019\u2018]/g,"'").replace(/\s+/g,' ').trim();
const curQ=()=>SES.qs[SES.idx];

function render(){
 $('#nav').innerHTML=NAV.map(([k,l])=>'<button data-a="nav" data-v="'+k+'" class="'+(VIEW===k?'on':'')+'">'+l+'</button>').join('');

function dday(){const d=(new Date(EXAM_DATE)-Date.now())/86400000;$('#dday').innerHTML=d>0?'OPIc 시험 <b>D-'+Math.ceil(d)+'</b> · 11/25(수) 18:20':'시험일 지남'}

function bars(d){return DIMS.map(([k,l])=>{const v=d[k];return '<div class="bar"><div class="lab">'+l+'</div><div class="tr"><i style="width:'+(v==null?0:v)+'%;background:'+(v==null?'#333':barColor(v))+'"></i></div><div class="v '+sc(v)+'">'+(v==null?'-':Math.round(v))+'</div></div>'}).join('')}
function issueHtml(i){return '<div class="issue '+(i.sev==='bad'?'bad':'')+'"><b>'+esc(i.t)+'</b><div class="small">'+esc(i.d)+'</div>'+(i.f?'<div class="small" style="margin-top:4px;white-space:pre-wrap"><span class="tag acc">이렇게</span> '+esc(i.f)+'</div>':'')+'</div>'}
function highlight(raw,res){
 raw=norm(raw);if(!raw)return '<span class="mute">(답변 없음)</span>';
 const hs=(res.hi||[]).slice().sort((a,b)=>b.p-a.p||a.s-b.s);const acc=[];
 for(const h of hs){if(!acc.some(a=>h.s<a.e&&h.e>a.s))acc.push(h)}
 acc.sort((a,b)=>a.s-b.s);let out='',i=0;
 for(const h of acc){out+=esc(raw.slice(i,h.s))+'<span class="'+h.c+'" title="'+esc(h.tt)+'">'+esc(raw.slice(h.s,h.e))+'</span>';i=h.e}

const asQ=(t,q,topic)=>({t,q,topicName:topic.name,kw:topic.kw||[]});
function pick3(topic){
 const by=t=>topic.qs.filter(x=>x.t===t);
 const used=new Set();const take=x=>{if(x)used.add(x);return x};
 const a=take(rnd(by('desc'))||rnd(topic.qs));
 const midPool=[...by('routine'),...by('compare')].filter(x=>!used.has(x));
 const b=take(rnd(midPool)||rnd(topic.qs.filter(x=>!used.has(x))));
 const c=take(rnd(by('past').filter(x=>!used.has(x)))||rnd(topic.qs.filter(x=>!used.has(x))));
 return [a,b,c].filter(Boolean).map(x=>asQ(x.t,x.q,topic));
}
function buildTest(){
 const survey=shuffle(TOPICS.filter(t=>t.kind==='survey'&&S.topics.includes(t.id)));
 const random=shuffle(TOPICS.filter(t=>t.kind==='random'));
 const sp=()=>survey.length?survey.shift():random.shift();
 const qs=[{t:'intro',q:INTRO_Q,topicName:'자기소개',kw:['name','student','major','university']}];
 const sets=[sp(),Math.random()<0.5?random.shift():sp(),Math.random()<0.6?random.shift():sp()];
 for(const st of sets)qs.push(...pick3(st));
 const rp=rnd(RP);for(const t of ['rp_ask','rp_problem','rp_exp'])qs.push({t,q:rp.qs[t],topicName:'롤플레이 · '+rp.name,kw:rp.kw});
 const adv=rnd(ADV);qs.push({t:'adv_compare',q:adv.adv_compare,topicName:'고난도 · '+adv.name,kw:adv.kw});qs.push({t:'adv_issue',q:adv.adv_issue,topicName:'고난도 · '+adv.name,kw:adv.kw});
 if(S.difficulty<=4){const e=rnd(EVA_QS);qs[14]={t:'rp_eva',q:e.q,topicName:'Eva에게 질문',kw:e.kw}}
 return qs.slice(0,15).map((q,i)=>Object.assign(q,{n:i+1}));
}
function practicePool(t){
 if(t==='intro')return [{t,q:INTRO_Q,topicName:'자기소개',kw:['name','student','major','university']}];
 if(['rp_ask','rp_problem','rp_exp'].includes(t))return RP.map(r=>({t,q:r.qs[t],topicName:'롤플레이 · '+r.name,kw:r.kw,tid:r.id}));
 if(t==='adv_compare'||t==='adv_issue')return ADV.map(a=>({t,q:a[t],topicName:'고난도 · '+a.name,kw:a.kw,tid:a.id}));
 if(t==='rp_eva')return EVA_QS.map(e=>({t,q:e.q,topicName:'Eva에게 질문',kw:e.kw}));
 const out=[];for(const tp of TOPICS)for(const x of tp.qs)if(x.t===t)out.push({t,q:x.q,topicName:tp.name,kw:tp.kw,tid:tp.id});return out;
}

 const overAgg={};for(const q of qs)for(const o of q.res.over){(overAgg[o.w]=overAgg[o.w]||{n:0,alts:o.alts}).n+=o.n}

 (sum.caps.length?'<div style="margin-top:10px">'+sum.caps.map(c=>'<div class="issue bad"><b>'+c.L+' 상한 요인 (이걸 안 고치면 '+c.L+' 위로 못 감)</b><div class="small">'+esc(c.why)+'</div></div>').join('')+'</div>':'')+'</div>'+
 '<div class="grid g2"><div class="card"><h3 style="margin-top:0">항목별 평균 (Q1 제외)</h3>'+bars(sum.dimAvg)+'</div><div class="card"><h3 style="margin-top:0">가장 부족한 것 TOP 3</h3>'+weakHtml+'</div></div>'+

VIEWS.rubric=()=>'<h1>평가기준</h1>'+
 '<div class="card"><h3 style="margin-top:0">1. 공식 기준 (첨부 가이드북 p.13)</h3><table><tr><th>평가영역</th><th>내용</th></tr><tr><td>Global Tasks / Functions</td><td>언어로 어떤 과제들을 수행할 수 있는지</td></tr><tr><td>Context / Content</td><td>과제 수행에 쓰는 사회적 문맥과 내용의 범위</td></tr><tr><td>Accuracy / Comprehensibility</td><td>답변의 보편적 이해도와 정확성</td></tr><tr><td>Text Type</td><td>발화량과 어문 구조 (단어 → 문장 → 문단)</td></tr></table>'+
 '<h3>등급 요약 (가이드북)</h3><table><tr><td><b>IM</b></td><td>익숙한 상황에서 문장을 나열하며 자연스럽게 말함. 다양한 문장·어휘를 실험적으로 사용. (IM은 Fluency·Delivery·Production으로 IM1~3 세분)</td></tr><tr><td><b>IH</b></td><td>익숙하지 않거나 예측 못한 복잡한 상황에서도 대부분 사건을 설명하고 문제를 해결. 발화량이 많고 어휘가 다양.</td></tr><tr><td><b>AL</b></td><td>사건 서술 시 <b>시제를 일관되게 관리</b>, 사람·사물 묘사에 <b>다양한 형용사</b>, 적절한 위치의 <b>접속사로 문장 간 결속력</b>, <b>문단 구조</b>를 능숙하게 구성. 익숙하지 않은 복잡한 상황도 설명·해결.</td></tr></table><p class="small mute">FAQ: 길기만 한 답변보다 질문에 충실하고 서론-본론-결론 구성. 문항당 짧으면 1분, 일반적으로 2분~2분 30초 권장. 발음은 이해 가능한 수준이면 큰 영향 없음. 모르는 주제도 답해야 함 (무응답 감점/UR).</p></div>'+

function buildPrompt(items){
 let s='너는 ACTFL OPIc 영어 말하기 채점 기준을 잘 아는 엄격한 스피킹 코치야. 아래 응시자의 답변(음성인식 텍스트, 구두점은 인식기 한계로 부정확할 수 있음)을 채점해줘. 목표 등급은 AL. 아첨하지 말고 솔직하게.\n\n[평가 기준]\n- ACTFL 4영역: Global Tasks/Functions, Context/Content, Accuracy/Comprehensibility, Text Type(문장→문단)\n- IH: 익숙하지 않은 복잡한 상황에서도 대부분 사건 설명·문제 해결, 발화량 많고 어휘 다양\n- AL: 서술 시 시제를 일관되게 관리, 다양한 형용사로 묘사, 접속사로 문장 결속, 문단 구조 능숙, 익숙하지 않은 복잡한 상황도 설명·해결\n- 세부진단서 항목: 시제 통제(특히 과거 경험 문항), 동사 형태, 논리적 전개, Scale(sentence→strings→connected→skeletal paragraph), 어휘 폭(같은 표현 반복 시 IH 상한), Q12 문제 해결 성공 여부, 감점: 말속도, 2~3초 멈춤, 연결어 부족, 구문 단조, 수일치, 발음/강세/억양\n- 2026-10-29부터 영어 OPIc은 AI 자동채점(기준은 동일). 질문 의도 이탈·암기티가 나는 답변은 불리할 수 있음\n- 문항당 권장 길이 약 1분 30초~2분\n\n[답변]\n';
 for(const q of items){const m=q.res.metrics,a=q.ans||{};s+='\nQ'+(q.n||'-')+' ['+TYPES[q.t].name+'] '+q.q+'\n답변: "'+(norm(a.transcript)||'(무응답)')+'"\n자동지표: 단어 '+m.words+(a.dur?', 시간 '+Math.round(a.dur)+'초':'')+(m.wpm?', '+Math.round(m.wpm)+'WPM':'')+(a.mode==='voice'?', 2.5초+ 멈춤 '+(a.pauses||0)+'회':'')+(a.conf?', 음성인식 신뢰도 '+Math.round(a.conf*100)+'%':'')+(m.pastRatio!=null?', 과거형 비율 '+Math.round(m.pastRatio*100)+'%':'')+(a.mode==='type'?' (타이핑 답변)':'')+'\n'}
 s+='\n[출력 형식: 한국어로, 영어 예문은 영어로]\n1. 예상 등급(NH~AL)과 근거 3줄\n2. 기준별 점수(각 10점): 과제수행, 시제, 문단구성, 연결/복문, 어휘폭, 정확성, 유창성(지표 참고), 발화량\n3. 문항별 부족한 점 2~3개 (원문 인용 → 고친 문장)\n4. 반복되는 문법 오류 목록 (원문 → 수정, 규칙 한 줄)\n5. 반복 표현 → 대체 표현\n6. 점수가 가장 낮은 문항 '+(items.length>1?'2개':'')+'를 AL 수준으로 다시 쓴 버전 (내 내용 유지, 150~200단어, 90초 분량)\n7. 시험 전까지 우선순위 연습 3가지\n';
 return s;
}
async function callLLM(prompt){
 const k=(S.apiKey||'').trim();if(!k)throw new Error('API 키 없음');
 if(S.provider==='openai'){const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:S.model||'gpt-4.1-mini',messages:[{role:'user',content:prompt}]})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j.choices[0].message.content}
 if(S.provider==='anthropic'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.model||'claude-sonnet-4-5',max_tokens:6000,messages:[{role:'user',content:prompt}]})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j.content.map(c=>c.text||'').join('')}
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(S.model||'gemini-2.5-flash')+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j.candidates[0].content.parts.map(p=>p.text||'').join('');
}
function md(t){
 const L=esc(t).split('\n');let out='',inL=false;
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
 for(let l of L){if(/^\s*([-*]|\d+\.)\s+/.test(l)){if(!inL){out+='<ul>';inL=true}out+='<li>'+inl(l.replace(/^\s*([-*]|\d+\.)\s+/,''))+'</li>';continue}if(inL){out+='</ul>';inL=false}
  if(/^#{1,4}\s/.test(l))out+='<h4>'+inl(l.replace(/^#+\s/,''))+'</h4>';else if(l.trim())out+='<p>'+inl(l)+'</p>'}
 if(inL)out+='</ul>';return out;
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했어. ChatGPT/Claude에 붙여넣기!')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사했어')}}

/* ---------------- actions ---------------- */
async function startRec(){
 const c=SES.cur;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){c.phase='type';c.err='이 브라우저에서 마이크를 못 써서 타이핑 모드로 전환했어';c.qEnd=c.qEnd||Date.now();render();return}
 try{c.phase='rec';c.recStart=Date.now();render();const l0=$('#live');if(l0)l0.innerHTML='<span class="int">마이크 연결 중... 주소창에 권한 팝업이 떠 있으면 허용해줘.</span>';await Rec.start(onRecUpd);c.recStart=Date.now();const l1=$('#live');if(l1&&!Rec.finalText)l1.innerHTML='<span class="int">녹음 중. 말하면 여기에 받아쓰기가 떠.</span>'}
 catch(e){c.phase='type';c.err='마이크 사용 불가 ('+e.message+') → 이 문항은 타이핑으로. 주소창의 마이크 권한을 허용해줘.';c.qEnd=c.qEnd||Date.now();render()}
}
function onRecUpd(){const m=$('#meter i');if(m)m.style.width=(Rec.level*100)+'%';const l=$('#live');if(l&&(Rec.finalText||Rec.interim))l.innerHTML=esc(Rec.finalText)+'<span class="int">'+esc(Rec.interim)+'</span>';const w=$('#srwarn');if(w&&Rec.srErr)w.textContent='음성인식 오류: '+Rec.srErr+' (녹음은 계속됨. 끝난 뒤 텍스트를 직접 입력/수정 가능)'}
async function stopRec(){const c=SES.cur;if(c.phase!=='rec')return;c.phase='stopping';render();const r=await Rec.stop();c.ans=Object.assign({mode:'voice'},r);if(r.audioUrl)AUDIO[SES.id+'_'+SES.idx]=r.audioUrl;c.phase='review';render()}
async function submit(skip){
 const c=SES.cur,q=curQ();
 if(c.phase==='rec'){if(skip){Rec.abort();c.phase='ready'}else await stopRec()}
 if(skip){c.ans={mode:S.inputMode,transcript:'',dur:0}}
 else if(c.phase==='review'){const t=$('#tx');if(t)c.ans.transcript=t.value}
 else if(c.phase==='type'){const t=$('#tx');c.ans={mode:'type',transcript:t?t.value:'',dur:(Date.now()-(c.qEnd||c.shown))/1000}}
 else if(!c.ans){c.ans={mode:S.inputMode,transcript:'',dur:0}}
 speechSynthesis&&speechSynthesis.cancel();
 q.ans=c.ans;q.res=analyze(q,q.ans);q.peeked=c.peeked;
 if(SES.mode==='practice'){PRAC.unshift({id:uid(),date:new Date().toISOString(),t:q.t,q:q.q,topicName:q.topicName,kw:q.kw,ans:slimAns(q.ans),total:q.res.total,dims:q.res.dims});PRAC=PRAC.slice(0,300);saveP();SES.phase='fb';render();window.scrollTo(0,0);return}
 if(S.instantFb){SES.phase='fb';render();window.scrollTo(0,0);return}
 advance();
}
const slimAns=a=>({mode:a.mode,transcript:a.transcript,dur:a.dur,speechDur:a.speechDur,latency:a.latency,pauses:a.pauses,conf:a.conf,audioAnalysis:a.audioAnalysis});
function advance(){
 SES.phase='q';
 if(SES.idx===6&&!SES.adjusted&&SES.qs.length>7){SES.phase='adjust';render();return}
 if(SES.idx>=SES.qs.length-1){finishTest();return}
 SES.idx++;SES.cur=newCur();render();window.scrollTo(0,0);
}
function finishTest(){
 const qs=SES.qs;const sum=summarize(qs);
 const rep={id:SES.id,date:SES.date,difficulty:SES.difficulty,elapsed:(Date.now()-SES.start)/1000,qs:qs.map(q=>({n:q.n,t:q.t,q:q.q,topicName:q.topicName,kw:q.kw,ans:slimAns(q.ans||{mode:'type',transcript:'',dur:0}),peeked:q.peeked})),sum:{overall:sum.overall,level:sum.level,dimAvg:sum.dimAvg}};
 HIST.unshift(rep);HIST=HIST.slice(0,60);saveH();REP=rep;SES=null;VIEW='mock';render();window.scrollTo(0,0);
}
const ACT={
 nav:b=>go(b.dataset.v),
 topic:b=>{const id=b.dataset.id;S.topics=S.topics.includes(id)?S.topics.filter(x=>x!==id):[...S.topics,id];saveS();render()},
 startMock:()=>{if(!S.topics.length){toast('주제를 1개 이상 골라줘');return}REP=null;SES={mode:'mock',id:uid(),date:new Date().toISOString(),difficulty:S.difficulty,qs:buildTest(),idx:0,start:Date.now(),phase:'q',cur:newCur()};render();window.scrollTo(0,0)},
 play:async()=>{getAC();const c=SES.cur;if(c.phase==='rec')return;c.phase='playing';render();await speak(curQ().q);if(!SES||SES.cur!==c||c.phase!=='playing')return;c.played=true;c.qEnd=Date.now();
  if(S.inputMode==='type'){c.phase='type';render();return}
  if(S.autoRecord){beep();await startRec()}else{c.phase='ready';render()}},
 replay:async()=>{const c=SES.cur;if(c.replayUsed)return;c.replayUsed=true;if(c.phase==='rec'){Rec.abort()}if(c.phase==='type'){const t=$('#tx');c.draft=t?t.value:''}c.phase='ready';await ACT.play()},
 peek:()=>{SES.cur.peeked=true;const c=SES.cur;if(c.phase==='type'){const t=$('#tx');c.draft=t?t.value:''}if(c.phase==='rec'){const el=document.querySelector('.qtext');if(el){el.classList.remove('qhidden');el.textContent=curQ().q}return}render()},
 startRec:()=>{getAC();speechSynthesis.cancel();SES.cur.qEnd=SES.cur.qEnd||Date.now();SES.cur.played=true;startRec()},
 toType:()=>{const c=SES.cur;c.phase='type';c.qEnd=c.qEnd||Date.now();render()},
 stopRec:()=>stopRec(),
 rerec:()=>{SES.cur.ans=null;startRec()},
 next:()=>submit(false),
 skip:()=>submit(true),
 cont:()=>advance(),
 quit:()=>{if(SES.mode==='mock'){if(!confirm('시험을 종료할까? 지금까지 답한 문항만 채점해서 저장할게.'))return;if(SES.cur.phase==='rec')Rec.abort();SES.qs=SES.qs.slice(0,SES.idx+(SES.qs[SES.idx].res?1:0));if(!SES.qs.length){SES=null;render();return}finishTest()}else{if(SES.cur.phase==='rec')Rec.abort();SES=null;render()}},
 adjust:b=>{SES.adjusted=true;if(b.dataset.v==='easy'){const e=rnd(EVA_QS);SES.qs[14]=Object.assign({t:'rp_eva',q:e.q,topicName:'Eva에게 질문',kw:e.kw},{n:15})}SES.phase='q';SES.idx++;SES.cur=newCur();render()},
 closeRep:()=>{REP=null;render()},
 openRep:b=>{REP=HIST[+b.dataset.i];VIEW='mock';render();window.scrollTo(0,0)},
 delRep:b=>{if(!confirm('삭제할까?'))return;HIST.splice(+b.dataset.i,1);saveH();render()},
 openPrac:b=>{const p=PRAC[+b.dataset.i];const q={t:p.t,q:p.q,topicName:p.topicName,kw:p.kw,ans:p.ans};$('#pracDetail').innerHTML='<div class="sep"></div>'+qDetail(q,analyze(q,p.ans),null)},
 psel:b=>{PSEL[b.dataset.k]=b.value;if(b.dataset.k==='t')PSEL.topic='';render()},
 pracStart:()=>{let pool=practicePool(PSEL.t);if(PSEL.topic)pool=pool.filter(p=>p.topicName===PSEL.topic);const q=Object.assign({},rnd(pool),{n:null});SES={mode:'practice',id:uid(),qs:[q],idx:0,phase:'q',cur:newCur()};render()},
 pracAgain:()=>{const q=Object.assign({},SES.qs[0]);delete q.ans;delete q.res;SES={mode:'practice',id:uid(),qs:[q],idx:0,phase:'q',cur:newCur()};render()},
 pracNew:()=>ACT.pracStart(),
 say:b=>{speak(b.dataset.text)},
 anaSample:b=>{const k=b.dataset.k,s=SAMPLES[k];const q={t:k,q:s.q,topicName:'예시',kw:(s.q.toLowerCase().match(/[a-z]{4,}/g)||[])};const ans={mode:'type',transcript:s.a};const r=analyze(q,ans);$('#sa_'+k).innerHTML='<div class="sep"></div><div class="tx">'+highlight(s.a,r)+'</div><div style="margin-top:8px">'+bars(r.dims)+'</div><div class="small mute">타이핑 취급이라 유창성은 제외. 총점 '+R(r.total)+' ('+levelOf(r.total)+')</div>'},
 copyPrompt:()=>{const qs=REP.qs.map(q=>Object.assign({},q,{res:analyze(q,q.ans)}));copyText(buildPrompt(qs))},
 copyPromptQ:()=>{const q=curQ();copyText(buildPrompt([q]))},
 llmRep:async b=>{const qs=REP.qs.map(q=>Object.assign({},q,{res:analyze(q,q.ans)}));const el=$('#llmrep');el.innerHTML='<p class="mute">AI 채점 중... (30초~1분)</p>';b.disabled=true;try{const t=await callLLM(buildPrompt(qs));LLMOUT[REP.id]=md(t);el.innerHTML=LLMOUT[REP.id]}catch(e){el.innerHTML='<p style="color:var(--bad)">오류: '+esc(e.message)+'</p>'}b.disabled=false},
 llmQ:async b=>{const q=curQ();const key=SES.id+'_'+SES.idx;const el=$('#llmq');el.style.display='';el.innerHTML='<p class="mute">AI 채점 중...</p>';b.disabled=true;try{const t=await callLLM(buildPrompt([q]));LLMOUT[key]=md(t);el.innerHTML=LLMOUT[key]}catch(e){el.innerHTML='<p style="color:var(--bad)">오류: '+esc(e.message)+'</p>'}b.disabled=false},
 export:()=>{const blob=new Blob([JSON.stringify({history:HIST,practice:PRAC},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='opic-al-trainer-'+new Date().toISOString().slice(0,10)+'.json';a.click()},
 wipe:()=>{if(!confirm('모든 기록을 지울까?'))return;HIST=[];PRAC=[];saveH();saveP();render()},
 micTest:async()=>{if(MICTEST&&!MICTEST.done){clearTimeout(MICTEST.to);const r=await Rec.stop();MICTEST={done:true,text:r.transcript,conf:r.conf,err:r.srErr};render();return}
  MICTEST={done:false};render();try{await Rec.start(()=>{const m=$('#meter i');if(m)m.style.width=(Rec.level*100)+'%';const l=$('#live');if(l)l.innerHTML=esc(Rec.finalText)+'<span class="int">'+esc(Rec.interim)+'</span>'});MICTEST.to=setTimeout(()=>ACT.micTest(),6000)}catch(e){MICTEST={done:true,text:'',err:e.message};render()}}
};
document.addEventListener('click',e=>{const hl=e.target.closest('.tx span[title]');if(hl){toast(hl.title,3200);return}const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('change',e=>{const b=e.target;if(b.id==='imp'){const f=b.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(j.history)HIST=j.history;if(j.practice)PRAC=j.practice;saveH();saveP();toast('가져왔어');render()}catch(err){toast('JSON 파일이 아니야')}});return}
 if(b.dataset&&b.dataset.a==='set'){let v=b.value;if(b.dataset.num)v=parseFloat(v);if(b.dataset.bool)v=v==='1';S[b.dataset.k]=v;saveS();if(['provider','rate'].includes(b.dataset.k))render();return}
 if(b.dataset&&b.dataset.a==='psel'){ACT.psel(b)}});
setInterval(()=>{dday();if(!SES||!SES.cur)return;const gt=$('#gt');if(gt&&SES.mode==='mock'){const rem=40*60-(Date.now()-SES.start)/1000;gt.textContent=(rem<0?'-':'')+fmt(Math.abs(rem));gt.style.color=rem<300?'var(--bad)':''}
 const qt=$('#qt');if(qt){const c=SES.cur;const base=c.phase==='rec'||c.phase==='stopping'?c.recStart:(c.qEnd||c.shown);qt.textContent=fmt((Date.now()-base)/1000);const T=TYPES[curQ().t];const el=(Date.now()-base)/1000;qt.style.color=el>T.sec[1]+30?'var(--bad)':el>=T.sec[0]?'var(--good)':''}},500);
window.addEventListener('beforeunload',e=>{if(SES&&SES.mode==='mock'){e.preventDefault();e.returnValue=''}});
dday();render();
</script>
